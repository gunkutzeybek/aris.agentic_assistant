[project]
name = "homapel-conversation"
version = "0.5.0"
description = "Home Assistant custom integration that makes a home a Laris home"
requires-python = ">=3.13"
license = { file = "LICENSE" }

[project.optional-dependencies]
test = [
  "pytest-homeassistant-custom-component==0.13.357",
  "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-p no:cacheprovider --strict-markers"
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["custom_components", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "W",    # pycodestyle warnings
  "I",    # isort
  "UP",   # pyupgrade
  "B",    # bugbear
  "ASYNC",
  "RUF",
]
ignore = [
  "E501",   # line length handled by formatter
  "RUF001", "RUF002", "RUF003",  # Turkish / typographic characters in strings and docs
  "RUF012",
  "ASYNC109",  # aiohttp-style explicit timeout parameters
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components", "tests"]
force-sort-within-sections = true
combine-as-imports = true
section-order = ["future", "standard-library", "third-party", "homeassistant", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
"homeassistant" = ["homeassistant"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ASYNC"]
