name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check manifest version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION=$(python -c "import json; print(json.load(open('custom_components/homapel_conversation/manifest.json'))['version'])")
          if [ "$TAG" != "$MANIFEST_VERSION" ]; then
            echo "Tag ($TAG) does not match manifest version ($MANIFEST_VERSION)"
            exit 1
          fi

      - name: Create zip
        working-directory: custom_components/homapel_conversation
        run: zip -r ../../homapel_conversation.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: homapel_conversation.zip
          generate_release_notes: true
