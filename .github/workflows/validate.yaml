name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: HACS Action
        uses: hacs/action@22.5.0
        with:
          category: integration
          # No brand assets yet and not listed in home-assistant/brands. Must be
          # removed (and real assets added) before the HACS default-store
          # submission - see CLAUDE.md section 2.
          ignore: brands

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Hassfest
        # @1.0.0 is broken ("No module named 'script'"); master is the ref
        # Home Assistant documents for this action.
        uses: home-assistant/actions/hassfest@master

  pytest:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # pytest-homeassistant-custom-component 0.13.357 pins HA 2026.8.3 (Python 3.14).
          python-version: "3.14"
          cache: pip
      - name: Install test dependencies
        run: pip install -e ".[test]"
      - name: Ruff
        run: ruff check custom_components tests
      - name: Pytest
        run: pytest tests -q
